name: build-hg5585f-73

on:
  push:
    branches:
      - hg5585f
      - honk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget swig libelf-dev dwarves

      # Reuse the host tools/toolchain between runs: a full run is ~1h, most of
      # which is the toolchain. The key includes the config so a config change
      # invalidates it, and restore-keys keeps the last toolchain for a fast
      # retry after a kernel-only fix.
      - name: Cache host tools + toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
            build_dir/host
          key: toolchain-v1-${{ hashFiles('configs/hg5585f-cu.config') }}
          restore-keys: |
            toolchain-v1-

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch PON driver for Linux 7.3
        run: sh scripts/patch-pon-7.3.sh

      - name: Configure
        run: |
          cp configs/hg5585f-cu.config .config
          make defconfig
          echo '--- target/device lines ---'
          grep -E 'CONFIG_TARGET_(airoha|DEVICE|PER_DEVICE)|CONFIG_TESTING_KERNEL' .config || true
          grep -E '^CONFIG_TARGET_DEVICE_.*fiberhome' .config || true

      - name: Download sources
        run: make download -j8 V=s

      # Enabling BTF/KPROBES/NETKIT selects new kernel symbols.  In batch
      # builds `make syncconfig` stops on them; accept the Kconfig defaults
      # once so the kernel config is stable before the real build.
      - name: Prepare kernel config defaults
        run: yes "" | make kernel_oldconfig

      - name: Check honk kernel config
        run: sh scripts/check-honk-config.sh

      - name: Build
        run: make -j"$(nproc)" V=s

      # Preserve the toolchain even when the build fails, so the next
      # kernel-only fix does not spend ~25 min rebuilding it.
      - name: Save host tools + toolchain
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
            build_dir/host
          key: toolchain-v1-${{ hashFiles('configs/hg5585f-cu.config') }}

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg5585f-cu-7.3.1
          if-no-files-found: warn
          path: |
            bin/targets/airoha/an7581/*sysupgrade*
            bin/targets/airoha/an7581/*recovery*
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/sha256sums

      - name: Show failure hints
        if: failure()
        run: |
          echo '--- patch/build logs ---'
          find build_dir -name '*.log' -maxdepth 6 2>/dev/null | head -20
          tail -200 logs/*.log 2>/dev/null || true
