name: build-hg5585f-73

on:
  push:
    branches:
      - hg5585f
      - honk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One job per board: `make defconfig` keeps a single CONFIG_TARGET_DEVICE_*
    # symbol per run, so CT and CU must not share a config file.
    strategy:
      fail-fast: false
      matrix:
        device: [ cu, ct ]
    name: build (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget swig libelf-dev dwarves

      # Reuse the host tools/toolchain between runs: a full run is ~3h, most of
      # which is the toolchain. The key includes the board config so a config
      # change invalidates it, and restore-keys keeps the last toolchain for a
      # fast retry after a kernel-only fix.
      - name: Cache host tools + toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
            build_dir/host
          key: toolchain-v2-${{ matrix.device }}-${{ hashFiles('configs/hg5585f-cu.config', 'configs/hg5585f-ct.config') }}
          restore-keys: |
            toolchain-v2-${{ matrix.device }}-
            toolchain-v1-

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch PON driver for Linux 7.3
        run: sh scripts/patch-pon-7.3.sh

      - name: Configure
        run: |
          cp configs/hg5585f-${{ matrix.device }}.config .config
          make defconfig
          echo '--- target/device lines ---'
          grep -E 'CONFIG_TARGET_(airoha|DEVICE|PER_DEVICE)|CONFIG_TESTING_KERNEL' .config || true
          grep -E '^CONFIG_TARGET_DEVICE_.*fiberhome' .config || true

      - name: Download sources
        run: make download -j8 V=s

      # Enabling BTF/KPROBES/NETKIT selects new kernel symbols.  In batch
      # builds `make syncconfig` stops on them; accept the Kconfig defaults
      # once so the kernel config is stable before the real build.
      - name: Prepare kernel config defaults
        run: yes "" | make kernel_oldconfig

      - name: Check honk kernel config
        run: sh scripts/check-kernel-config.sh
      # Patched autotools packages fail late and inscrutably (missing automake
      # shows up as "Error 127" after hours). Build libnftnl on its own first
      # so that class of failure surfaces long before the image build.
      - name: Smoke build patched packages
        run: |
          # Catch packaging problems in minutes instead of after the image
          # build: a missing autotools tool, a bad git mirror hash, a patch
          # that no longer applies.
          #
          # Only userspace packages are compiled here. nftables depends on
          # kmod-nft-core, and compiling a kernel-module package straight after
          # `make kernel_oldconfig` races the kernel's generated asm headers
          # ("asm/percpu_types.h: No such file"), which a full `make` orders
          # correctly. Its patches and sources are still validated by prepare.
          make package/libs/libnftnl/compile -j"$(nproc)" V=s
          make package/network/utils/nftables/prepare V=s
          make package/network/utils/fullconenat-nft/download V=s

      - name: Build
        run: make -j"$(nproc)" V=s

      # Preserve the toolchain even when the build fails, so the next
      # kernel-only fix does not spend ~25 min rebuilding it.
      - name: Save host tools + toolchain
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
            build_dir/host
          key: toolchain-v2-${{ matrix.device }}-${{ hashFiles('configs/hg5585f-cu.config', 'configs/hg5585f-ct.config') }}

      # Rename in place: a copy would leave two identical images per board and
      # make the artifact ambiguous.
      - name: Tag images with date and build number
        if: always()
        run: |
          TAG="$(date -u +%Y%m%d)-b${{ github.run_number }}"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"
          cd bin/targets/airoha/an7581 2>/dev/null || exit 0
          for f in *sysupgrade*.itb *recovery*.itb; do
            [ -e "$f" ] || continue
            case "$f" in *"-$TAG.itb") continue ;; esac
            mv -f "$f" "${f%.itb}-$TAG.itb"
          done
          sha256sum ./*-"$TAG".itb > "sha256sums-$TAG.txt" 2>/dev/null || true
          {
            echo "### Firmware build $TAG (${{ matrix.device }})"
            echo ''
            echo '```'
            sha256sum ./*-"$TAG".itb 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Guard against the old copy-based naming coming back: exactly one
      # sysupgrade and one recovery per board, and nothing left untagged.
      - name: Verify one image per type
        if: success()
        run: |
          cd bin/targets/airoha/an7581
          tag="$BUILD_TAG"
          up=$(ls -1 ./*-squashfs-sysupgrade-"$tag".itb 2>/dev/null | wc -l)
          rec=$(ls -1 ./*-initramfs-recovery-"$tag".itb 2>/dev/null | wc -l)
          left=$(ls -1 ./*.itb 2>/dev/null | grep -v -- "-$tag.itb" | wc -l)
          echo "sysupgrade=$up recovery=$rec untagged=$left tag=$tag"
          [ "$up" = 1 ] || { echo "expected exactly 1 sysupgrade image" >&2; exit 1; }
          [ "$rec" = 1 ] || { echo "expected exactly 1 recovery image" >&2; exit 1; }
          [ "$left" = 0 ] || { echo "untagged images left in the output dir" >&2; ls -1 ./*.itb; exit 1; }

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg5585f-${{ matrix.device }}-7.3.1-${{ env.BUILD_TAG || github.run_number }}
          if-no-files-found: warn
          path: |
            bin/targets/airoha/an7581/*sysupgrade*.itb
            bin/targets/airoha/an7581/*recovery*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/sha256sums*.txt

      - name: Publish firmware release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ env.BUILD_TAG }}-${{ matrix.device }}
          name: HG5585F ${{ matrix.device }} ${{ env.BUILD_TAG }}
          body: |
            OpenWrt SNAPSHOT, kernel 7.3.1, board `fiberhome,hg5585f-${{ matrix.device }}`.
            Built from `${{ github.sha }}` (run ${{ github.run_number }}).
          prerelease: true
          files: |
            bin/targets/airoha/an7581/*-${{ env.BUILD_TAG }}.itb
            bin/targets/airoha/an7581/sha256sums-${{ env.BUILD_TAG }}.txt

      - name: Show failure hints
        if: failure()
        run: |
          echo '--- patch/build logs ---'
          find build_dir -name '*.log' -maxdepth 6 2>/dev/null | head -20
          tail -200 logs/*.log 2>/dev/null || true
